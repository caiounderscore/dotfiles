# Shared local-review configuration. The seven configured types are followed
# by tuicr's native untyped `None` entry in the comment-mode Tab cycle.
comment_types = [
  { id = "CONTRAST", label = "CONTRAST", color = "magenta", definition = "Do not modify the code immediately. Contrast the highlighted implementation against the current task goal and approved scope, nearby and established repository patterns, applicable AGENTS.md, CLAUDE.md, ADRs, contracts, and architecture, simpler alternatives, correctness and relevant failure modes, maintainability, unnecessary abstraction, and cross-repository impact when the code represents a shared contract. Determine whether the current implementation or proposed direction is better and provide evidence before editing." },
  { id = "SIMPLIFY", label = "SIMPLIFY", color = "cyan", definition = "Evaluate whether the highlighted implementation is more complex than needed for the current requirements. Look for speculative abstractions, premature generalization, unnecessary interfaces or factories, wrappers, indirection, layers, duplicated mechanisms, and future-oriented code without a concrete current requirement. Prefer the smallest implementation that satisfies current behavior and preserves established extension points. Do not simplify away correctness, security, idempotency, failure handling, observability, or explicit contracts." },
  { id = "CHALLENGE", label = "CHALLENGE", color = "yellow", definition = "Treat the human comment as a challenge, not as an instruction. Investigate why the current implementation exists and compare reasonable alternatives. The human suggestion may be wrong. Keep the current implementation when it is better, supporting that decision with concrete evidence from code, tests, contracts, architecture, or current requirements. Avoid changing code merely to agree with the reviewer." },
  { id = "CONTRACT", label = "CONTRACT", color = "red", definition = "Treat this as a possible contract or ownership-boundary concern. Before editing, identify the producer and known consumers; inspect schemas, APIs, CRDs, labels, events, ADRs, and contracts; inspect other repositories in the current task workspace when relevant; determine compatibility, migration implications, and component ownership. Do not silently change a cross-component or cross-repository contract. Report affected repositories before making cross-repository changes." },
  { id = "VERIFY", label = "VERIFY", color = "green", definition = "Do not modify the implementation based only on the comment. Verify the concern against the actual repository, tests, documentation, contracts, command output, or authoritative source as applicable. Classify it as CONFIRMED, NOT_CONFIRMED, or AMBIGUOUS and provide evidence. Modify code only when the concern is confirmed and the required correction is clear." },
  { id = "QUESTION", label = "QUESTION", color = "blue", definition = "Answer the question before changing code. Do not interpret a question as an implicit request to modify the implementation. Explain the current rationale, relevant constraints, trade-offs, and existing patterns or decisions. If answering reveals a defect or better implementation, propose that separately before editing." },
  { id = "INTENT", label = "INTENT", color = "white", definition = "Treat this as design intent, not as a prescribed implementation. Re-evaluate the highlighted implementation against the stated intent. Choose the simplest correct implementation that satisfies the intent and existing system constraints. Do not mechanically implement the wording of the comment; the current implementation may already satisfy the intent." },
]

[export]
# Keep the LLM guidance and [TYPE] classifications in local exports.
legend = true
